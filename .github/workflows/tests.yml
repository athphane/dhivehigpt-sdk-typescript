name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Read-only by default; only the `coverage` job elevates to `contents: write`,
# and only to commit the regenerated badge.
permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'coverage')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Generate coverage badge
        run: node scripts/generate-coverage-badge.mjs

      - name: Commit coverage badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          if git diff --cached --quiet; then
            echo "Coverage badge unchanged, nothing to commit."
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi
